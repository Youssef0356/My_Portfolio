<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Morph Scroll Demo - Youssef Neji</title>
    <link rel="stylesheet" href="src/styles/morph-scroll.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a0a2e;
            color: white;
            font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        
        .intro-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: linear-gradient(135deg, #1a0a2e 0%, #2a1548 100%);
            position: relative;
            z-index: 1;
        }
        
        .intro-section h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }
        
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-20px); }
            60% { transform: translateX(-50%) translateY(-10px); }
        }
        
        .scroll-indicator::after {
            content: '↓ Scroll to Experience the Morph ↓';
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
        }
        
        .outro-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2a1548 0%, #1a0a2e 100%);
            position: relative;
            z-index: 1;
        }
        
        .outro-section h2 {
            font-size: 3rem;
            text-align: center;
            max-width: 800px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <!-- Introduction Section -->
    <div class="intro-section">
        <h1>Welcome to My World</h1>
        <p style="font-size: 1.5rem; opacity: 0.8;">A 3D Journey Through Creativity</p>
        <div class="scroll-indicator"></div>
    </div>
    
    <!-- 3D Morph Scroll Section -->
    <section class="morph-scroll-section" id="morph-experience">
        <!-- Progress Indicator -->
        <div class="morph-progress">
            <div class="morph-progress-bar"></div>
        </div>
        
        <!-- Main Spiral Container -->
        <div class="spiral-container">
            <div class="morph-track">
                <!-- Morph items will be dynamically added here -->
            </div>
            
            <!-- Central Text Display with Soft Skills -->
            <div class="soft-skills-morph">
                <h2 class="morph-text">My Journey</h2>
                <!-- Skill orbs will be dynamically added here -->
            </div>
        </div>
        
        <!-- Loading indicator -->
        <div class="morph-loading" style="display: none;"></div>
    </section>
    
    <!-- Outro Section -->
    <div class="outro-section">
        <h2>Let's Create Something Amazing Together</h2>
    </div>
    
    <!-- 3D Morph Scroll Effect Script -->
    <script src="src/js/morph-scroll.js"></script>
</body>
</html>
