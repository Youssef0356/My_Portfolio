<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Youssef Neji</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;700&display=swap"
    rel="stylesheet">

  <!-- Icons -->
  <script src="https://kit.fontawesome.com/6234cd1732.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <!-- Styles -->
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="src/styles/sections.css">

  <!-- Favicon -->
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23a78bfa'%3EY%3C/text%3E%3C/svg%3E">

  <!-- Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>

  <!-- Background -->
  <div class="bg-grid"></div>
  <div class="bg-glow" style="background: radial-gradient(circle, rgba(0, 243, 255, 0.1) 0%, rgba(0,0,0,0) 70%);"></div>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        Youssef <span>Neji</span>
      </a>

      <button class="nav-toggle" id="navToggle">
        <i class="material-icons">menu</i>
      </button>

      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">About</a>
        <a href="Projects.html" class="nav-link active">Projects</a>
        <a href="Contact.html" class="nav-link">Contact</a>
        <a href="https://www.facebook.com/youssef.dragonboll/" target="_blank" class="nav-link"><i
            class="fab fa-facebook-f"></i></a>
        <a href="https://www.linkedin.com/in/youssef-neji-a13604279/" target="_blank" class="nav-link"><i
            class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </nav>

  <!-- Projects Content -->
  <section class="projects-page">
    <div class="container">

      <div class="hero-content text-center" style="margin: 0 auto 3rem; padding-top: 4rem;">
        <h1 class="hero-title fade-in">Featured Work</h1>
        <p class="hero-subtitle fade-in delay-100">Exploring the boundaries of 3D, Interactivity, and Design.</p>
      </div>

      <!-- Featured Carousel -->
      <div class="carousel-section fade-in delay-200" id="featuredCarousel">
        <!-- Injected via JS -->
      </div>

      <!-- Filters -->
      <div class="filters-container fade-in delay-200">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="recent">Recent</button>
        <button class="filter-btn" data-filter="architecture">Architecture</button>
        <button class="filter-btn" data-filter="game-development">Game Dev</button>
        <button class="filter-btn" data-filter="vfx">CGI/VFX</button>
        <button class="filter-btn" data-filter="videoediting">Video Editing</button>
        <button class="filter-btn" data-filter="animation">Animation</button>
        <button class="filter-btn" data-filter="other">Other</button>
      </div>

      <!-- Grid -->
      <div class="projects-grid" id="projectsGrid">
        <!-- Injected via JS -->
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container flex space-between" style="flex-wrap: wrap; gap: 2rem;">
      <div>
        <h3 style="margin-bottom: 0.5rem; color: #fff;">PORTFOLIO</h3>
        <p>Youssef Neji &copy; 2025</p>
      </div>
      <div class="footer-links">
        <a href="index.html">About</a>
        <a href="Projects.html">Projects</a>
        <a href="Contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="src/js/particles.js"></script>
  <script src="src/js/projects-data.js"></script>
  <script src="src/js/creative.js"></script>
  <script>
    // Start Navigation Logic
    const toggleBtn = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    toggleBtn.addEventListener('click', () => {
      navLinks.classList.toggle('nav-open');
    });

    // --- Projects Logic ---
    let allProjects = [];
    let filteredProjects = [];
    let currentIndex = 0;

    // Fetch Projects
    // Fetch Projects with Cache Busting
    function initProjects(data) {
      allProjects = data;
      // Parse dates and sort
      allProjects.forEach(p => p.parsedDate = parseDate(p.date));
      allProjects.sort((a, b) => b.parsedDate - a.parsedDate);

      // DEFAULT TO ALL
      filteredProjects = allProjects;

      // Reset Filter Buttons UI
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-filter="all"]').classList.add('active');

      if (filteredProjects.length > 0) {
        renderFeatured(filteredProjects[0]);
        renderGrid(filteredProjects);
      } else {
        document.getElementById('projectsGrid').innerHTML = '<p class="text-center w-full col-span-3 text-muted">No projects found.</p>';
      }

      // Animation triggers
      // Removed initial animation loop to ensure content is immediately visible (per user request).
      // We only refresh ScrollTrigger to keep things in sync if needed, but no hiding.
      setTimeout(() => {
        ScrollTrigger.refresh();
      }, 100);
    }

    // Try to load from variable first (works locally), then fetch (works on server if variable missing)
    if (typeof projectData !== 'undefined') {
      initProjects(projectData);
    } else {
      fetch('videos.json?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => initProjects(data))
        .catch(err => {
          console.error("Error loading projects:", err);
          document.getElementById('projectsGrid').innerHTML = '<p class="text-center w-full col-span-3 text-muted">Error loading projects. Please check console.</p>';
        });
    }

    // Filters
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Update Active State
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const filter = btn.dataset.filter;

        if (filter === 'all') {
          filteredProjects = allProjects;
        } else if (filter === 'recent') {
          const sixMonthsAgo = new Date();
          sixMonthsAgo.setMonth(sixMonthsAgo.getMonth() - 6);
          filteredProjects = allProjects.filter(p => p.parsedDate >= sixMonthsAgo);
        } else {
          filteredProjects = allProjects.filter(p =>
            (p.category || '').toLowerCase().replace(/\s/g, '-') === filter
          );
        }

        renderGrid(filteredProjects);
        if (filteredProjects.length > 0) renderFeatured(filteredProjects[0]);

        // Re-animate
        // Re-animate (Skip for 'all' filter as requested)
        if (filter !== 'all') {
          gsap.from(".project-card", {
            opacity: 0,
            y: 20,
            duration: 0.4,
            stagger: 0.05,
            clearProps: "all"
          });
        }
      });
    });

    function renderFeatured(project) {
      const container = document.getElementById('featuredCarousel');
      if (!project) {
        container.innerHTML = '<div class="p-8 text-center text-muted">No featured project found.</div>';
        return;
      }

      const mediaHtml = project.url
        ? `<iframe src="${normalizeUrl(project.url)}" frameborder="0" allowfullscreen></iframe>`
        : `<img src="${project.image || 'Images/placeholder.jpg'}" alt="${project.title}">`;

      container.innerHTML = `
                <div class="carousel-slide">
                    <div class="carousel-visual">
                        ${mediaHtml}
                    </div>
                    <div class="carousel-info">
                        <span class="project-category" style="margin-bottom: 1rem;">${project.category || 'Featured'}</span>
                        <h2 style="font-size: 2rem; margin-bottom: 1rem;">${project.title}</h2>
                        <p style="margin-bottom: 2rem; color: var(--text-muted);">${project.description || ''}</p>
                        
                        <div class="project-tools" style="margin-bottom: 2rem;">
                             ${(project.tools || []).map(t => `<span class="tool-badge">${t}</span>`).join('')}
                        </div>
                        
                        <div class="flex gap-1">
                             ${project.link ? `<a href="${project.link}" target="_blank" class="btn btn-primary">View Project</a>` : ''}
                             ${project.github ? `<a href="${project.github}" target="_blank" class="btn btn-outline">Code</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
    }

    function renderGrid(projects) {
      const grid = document.getElementById('projectsGrid');
      grid.innerHTML = '';

      if (projects.length === 0) {
        grid.innerHTML = '<p class="text-center w-full col-span-3 text-muted">No projects found for this category.</p>';
        return;
      }

      projects.forEach((project, idx) => {
        const card = document.createElement('div');
        card.className = 'project-card';
        // Add click handler to whole card for better UX
        card.onclick = () => filterToProject(idx);
        card.style.cursor = 'pointer';

        let thumbHtml = '';
        const youtubeId = getYoutubeId(project.url);

        if (youtubeId) {
          thumbHtml = `<img src="https://img.youtube.com/vi/${youtubeId}/mqdefault.jpg" alt="${project.title}" loading="lazy">
                         <div class="play-overlay"><i class="fas fa-play"></i></div>`;
        } else if (project.image) {
          thumbHtml = `<img src="${project.image}" alt="${project.title}" loading="lazy">`;
        } else {
          // Fallback for Drive/Other
          thumbHtml = `<div class="placeholder-thumb">
                            <i class="fas fa-video"></i>
                            <span>View Project</span>
                         </div>`;
        }

        card.innerHTML = `
                    <div class="project-thumb">
                        ${thumbHtml}
                    </div>
                    <div class="project-content">
                        <div class="project-category">${project.category || 'Project'}</div>
                        <h3 class="project-title">${project.title}</h3>
                        <p class="project-desc">${project.description || ''}</p>
                        <div class="project-tools">
                            ${(project.tools || []).slice(0, 3).map(t => `<span class="tool-badge">${t}</span>`).join('')}
                            ${(project.tools || []).length > 3 ? `<span class="tool-badge">+${project.tools.length - 3}</span>` : ''}
                        </div>
                        <div class="project-links">
                             <button class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.8rem;">details</button>
                             ${project.github ? `<a href="${project.github}" target="_blank" style="color:var(--text-dim);" onclick="event.stopPropagation()"><i class="fab fa-github"></i></a>` : ''}
                        </div>
                    </div>
                `;
        grid.appendChild(card);
      });
    }

    // Helper to extract YT ID
    function getYoutubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Helper to scroll up and show
    window.filterToProject = function (indexInFiltered) {
      const project = filteredProjects[indexInFiltered];
      renderFeatured(project);
      document.getElementById('featuredCarousel').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function normalizeUrl(url) {
      if (!url) return '';
      if (url.includes('youtu.be/')) return `https://www.youtube.com/embed/${url.split('youtu.be/')[1].split(/[?&]/)[0]}`;
      if (url.includes('watch?v=')) return `https://www.youtube.com/embed/${url.split('watch?v=')[1].split('&')[0]}`;
      return url;
    }

    function parseDate(dateStr) {
      if (!dateStr) return new Date(0);
      return new Date(dateStr); // Simplified for now, complex regex from old code can be added if needed
    }
  </script>
</body>

</html>
